<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a Club - UniClubs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">UniClubs</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#clubs">Clubs</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#footer">Contact</a></li>
          <li class="nav-item"><a class="nav-link active" href="register.html">Join Us</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 700px;">
    <div class="card p-4">
      <h2>Club Membership Form</h2>

      <!-- novalidate turns off the browser's own popup validation -->
      <!-- because we are writing our own validation in script.js -->
      <form id="myForm" novalidate>

        <label>Full Name</label>
        <input type="text" id="name" class="form-control">
        <small class="text-danger" id="nameError"></small><br>

        <label class="mt-2">Email</label>
        <input type="email" id="email" class="form-control">
        <small class="text-danger" id="emailError"></small><br>

        <label class="mt-2">Phone (01XXXXXXXXX)</label>
        <input type="text" id="phone" class="form-control">
        <small class="text-danger" id="phoneError"></small><br>

        <label class="mt-2">Password</label>
        <input type="password" id="password" class="form-control">
        <small class="text-danger" id="passwordError"></small><br>

        <label class="mt-2">Confirm Password</label>
        <input type="password" id="confirm" class="form-control">
        <small class="text-danger" id="confirmError"></small><br>

        <label class="mt-2">Date of Birth</label>
        <input type="date" id="dob" class="form-control">
        <small class="text-danger" id="dobError"></small><br>

        <label class="mt-2">Choose Club</label>
        <select id="club" class="form-select">
          <option value="">-- Select --</option>
          <option>Programming Club</option>
          <option>Photography Club</option>
          <option>Debating Club</option>
        </select>
        <small class="text-danger" id="clubError"></small><br>

        <label class="mt-2">Gender</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female" class="ms-3"> Female
        <input type="radio" name="gender" value="Other" class="ms-3"> Other<br>
        <small class="text-danger" id="genderError"></small><br>

        <label class="mt-2">Why do you want to join?</label>
        <textarea id="reason" rows="3" class="form-control"></textarea>
        <small class="text-danger" id="reasonError"></small><br>

        <input type="checkbox" id="terms" class="mt-2"> I agree to the club rules<br>
        <small class="text-danger" id="termsError"></small><br>

        <button type="submit" class="btn btn-primary mt-3">Submit</button>
        <button type="reset" class="btn btn-secondary mt-3">Reset</button>
      </form>

      <!-- this box is hidden (d-none) until the form is submitted successfully -->
      <div id="result" class="alert alert-success mt-4 d-none"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
