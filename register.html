<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a Club - UniClubs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand">UniClubs</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#clubs">Clubs</a></li>
        <li><a href="index.html#footer">Contact</a></li>
        <li><a href="register.html">Join Us</a></li>
      </ul>
      <button class="hamburger" id="hamburgerBtn">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <div class="form-wrap">
    <div class="form-card">
      <h2>Club Membership Form</h2>

      <!-- novalidate turns off the browser's own popup validation -->
      <!-- because we are writing our own validation in script.js -->
      <form id="myForm" novalidate>

        <label for="name">Full Name</label>
        <input type="text" id="name">
        <span class="error-text" id="nameError"></span>

        <label for="email">Email</label>
        <input type="email" id="email">
        <span class="error-text" id="emailError"></span>

        <label for="phone">Phone (01XXXXXXXXX)</label>
        <input type="text" id="phone">
        <span class="error-text" id="phoneError"></span>

        <label for="password">Password</label>
        <input type="password" id="password">
        <span class="error-text" id="passwordError"></span>

        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm">
        <span class="error-text" id="confirmError"></span>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob">
        <span class="error-text" id="dobError"></span>

        <label for="club">Choose Club</label>
        <select id="club">
          <option value="">-- Select --</option>
          <option>Programming Club</option>
          <option>Photography Club</option>
          <option>Debating Club</option>
        </select>
        <span class="error-text" id="clubError"></span>

        <label>Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
        <span class="error-text" id="genderError"></span>

        <label for="reason">Why do you want to join?</label>
        <textarea id="reason" rows="3"></textarea>
        <span class="error-text" id="reasonError"></span>

        <div class="checkbox-line">
          <label><input type="checkbox" id="terms"> I agree to the club rules</label>
        </div>
        <span class="error-text" id="termsError"></span>

        <div class="form-buttons">
          <button type="submit" class="btn btn-primary">Submit</button>
          <button type="reset" class="btn btn-secondary" style="color:#1c1f2b; border-color:#1c1f2b;">Reset</button>
        </div>
      </form>

      <!-- this box is hidden until the form is submitted successfully -->
      <div id="result" class="result-box hidden"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

  <!-- 4. FOOTER -->
  <footer id="footer">
    <div class="container">
      <p>Email: clubs@university.edu | Phone: 01700-000000</p>
      <p>
        <a href="https://facebook.com">Facebook</a>
        <a href="https://linkedin.com">LinkedIn</a>
        <a href="https://instagram.com">Instagram</a>
      </p>
      <p class="small">&copy; 2026 UniClubs</p>
    </div>
  </footer>
  
</html>
